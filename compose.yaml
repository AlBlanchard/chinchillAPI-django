services:
  api:
    build:
      context: .
    container_name: chinchillapi
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - .:/app

    depends_on:
      - db

  db:
    image: postgres:17
    container_name: chinchillapi_db
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
