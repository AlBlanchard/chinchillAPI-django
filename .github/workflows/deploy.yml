name: Deploy API

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: chinchillapi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Test Tailscale connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          tailscale status
          tailscale ping "$SSH_HOST"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rz \
            --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'media/' \
            --exclude 'staticfiles/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.coverage' \
            --exclude 'htmlcov/' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./ \
            "$SSH_USER@$SSH_HOST:/srv/apps/chinchillapi/"

      - name: Build, migrate and verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /srv/apps/chinchillapi

          compose() {
            sudo -n /usr/bin/docker compose -f /srv/apps/chinchillapi/compose.yaml "$@"
          }

          on_error() {
            result=$?
            trap - ERR
            set +e
            compose ps --all
            compose logs --no-color --tail 100 db api
            exit "$result"
          }
          trap on_error ERR

          compose build
          compose up -d db

          db_ready=false
          for attempt in {1..30}; do
            db_health=$(compose ps --all --format '{{.Health}}' db)
            echo "PostgreSQL health ($attempt/30): ${db_health:-missing}"
            if [ "$db_health" = "healthy" ]; then
              db_ready=true
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 5
            fi
          done
          if [ "$db_ready" != "true" ]; then
            echo 'PostgreSQL did not become healthy; stopping deployment.' >&2
            false
          fi

          echo "=== BEFORE MIGRATIONS ==="
          compose run --rm --no-deps -T api python manage.py migrate --noinput </dev/null
          echo "=== AFTER MIGRATIONS ==="

          echo "=== BEFORE API RECREATE ==="
          compose up -d --force-recreate api
          echo "=== AFTER API RECREATE ==="

          for attempt in {1..30}; do
            if status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8001/api/contact/); then
              echo "API HTTP status ($attempt/30): $status"
              if [ "$status" = "405" ]; then
                exit 0
              fi
            else
              echo "API connection failed ($attempt/30)." >&2
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          echo 'API did not reach the expected HTTP status; deployment failed.' >&2
          false
          REMOTE
