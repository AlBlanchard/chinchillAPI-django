name: Deploy API

on:
  push:
    branches:
      - main
      - deploy

concurrency:
  group: chinchillapi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Test Tailscale connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          tailscale status
          tailscale ping "$SSH_HOST"

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts

      - name: Upload application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rz \
            --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude '.venv' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "$SSH_USER@$SSH_HOST:/srv/apps/chinchillapi/"

      - name: Build and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "sudo /usr/bin/docker compose -f /srv/apps/chinchillapi/compose.yaml build &&
             sudo /usr/bin/docker compose -f /srv/apps/chinchillapi/compose.yaml up -d"

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            'STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/api/contact/)
             echo "API returned HTTP $STATUS"
             test "$STATUS" = "405"'
